# Cloudflare Workers project with STATIC ASSETS — not Cloudflare Pages.
#
# The distinction matters and has been written down wrongly twice in the
# reference deployment: the build and deploy commands differ between Workers
# and Pages, and getting them backwards produces a green build that deploys
# nothing. This repo uses a Worker with [assets] and no `main` script — a pure
# static deployment with no server-side code.
#
# In the Cloudflare dashboard, connect this repo under Workers Builds with:
#   Build command:  node build.mjs
#   Deploy command: npx wrangler deploy
#   Root directory: /
# Putting the build command in the deploy slot (or vice versa) leaves one slot
# empty and the deploy silently uploads a stale or empty ./public. After each
# deploy, verify the Active deployment version matches your latest commit.
#
# `name` below sets your free URL: <name>.<your-account>.workers.dev.
# The /setup skill rewrites it from site.config.json's "workerName" — if you
# are configuring by hand, keep the two in sync.

name = "zipcode-news-00000"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
# public/404.html is generated by build.mjs; serve it for unknown paths rather
# than a bare Cloudflare error page.
not_found_handling = "404-page"
