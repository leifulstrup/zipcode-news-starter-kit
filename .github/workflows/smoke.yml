name: Site smoke test

# The weekly workflow proves an issue was BUILT. Nothing else proves it was
# DEPLOYED — the host builds asynchronously after the commit, long after the run
# has finished and gone green, so every failure mode past `git push` is invisible
# without this. It runs an hour after the weekly job, and daily, against the real
# public URL. It is the only check in the system that looks at what a reader
# actually sees.
#
# The base URL comes from the repository variable SITE_BASE_URL (Settings →
# Secrets and variables → Actions → Variables). The /go-live skill sets it when
# it walks you through the Cloudflare setup:
#   gh variable set SITE_BASE_URL --body "https://<worker>.<account>.workers.dev"
# Until it is set, this workflow skips with a notice instead of failing — a red X
# on a site that does not exist yet teaches people to ignore red X's.

on:
  schedule:
    # KEEP roughly one hour after weekly.yml's cron, and adjust together.
    - cron: '0 21 * * 5'   # one hour after the weekly run publishes
    - cron: '0 13 * * *'   # and once a day, to catch silent rot
  workflow_dispatch:
    inputs:
      base:
        description: 'Base URL to test (blank = the SITE_BASE_URL repo variable)'
        type: string
        default: ''
      week:
        description: 'Also check this issue date (YYYY-MM-DD)'
        type: string
        default: ''

permissions:
  contents: read
  issues: write        # to report a broken site

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Is there a site to test yet?
        id: base
        run: |
          BASE="${{ github.event.inputs.base || vars.SITE_BASE_URL }}"
          if [ -z "$BASE" ]; then
            echo "::notice::SITE_BASE_URL is not set and no base was given — the site is not live yet, so there is nothing to smoke-test. /go-live sets the variable when you deploy."
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the site
        if: steps.base.outputs.base != ''
        run: |
          node bin/smoke-test.mjs \
            --base "${{ steps.base.outputs.base }}" \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}

      # The failure this system cannot see from the inside. GitHub DISABLES scheduled
      # workflows in a repository with 60 days of no activity, and emails the owner once. If
      # that mail is missed, every cron here stops at the same moment: no weekly issue, no
      # publication check, and no smoke test left to complain about any of it — the watchdog
      # is switched off along with everything it watches.
      #
      # A publication that is running resets the counter every week, so this number only
      # climbs once something has ALREADY gone quiet. That is exactly when a second, louder
      # signal is worth having. The case it is really for is a publisher who pauses over a
      # summer and expects the paper to resume by itself: it will not, and nothing would have
      # told them.
      #
      # Warned from day 45 rather than day 59, because a warning that arrives at the cliff
      # edge is a warning nobody can act on.
      - name: Warn before GitHub disables the schedule
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git log -1 --format=%cI)
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "last commit $LAST — $DAYS day(s) ago"
          if [ "$DAYS" -lt 45 ]; then
            echo "::notice::$DAYS days since the last commit; GitHub disables schedules at 60."
            exit 0
          fi
          echo "::warning::$DAYS days since the last commit. GitHub disables scheduled workflows at 60 days of inactivity, which would stop the weekly issue, the publication check and this smoke test together — silently."
          gh label create schedule-at-risk --color D93F0B \
            --description "Scheduled workflows are close to GitHub's 60-day inactivity cutoff" 2>/dev/null || true
          if [ -z "$(gh issue list --label schedule-at-risk --state open --limit 1 --json number --jq '.[].number')" ]; then
            gh issue create --label schedule-at-risk \
              --title "Scheduled workflows will be disabled in $(( 60 - DAYS )) days" \
              --body "The last commit to this repository was **$DAYS days ago** ($LAST).

          GitHub disables scheduled workflows after **60 days** of repository inactivity. When it does, the weekly issue, the publication check and this smoke test all stop at the same moment, and nothing is left to tell you — the watchdog is switched off along with what it watches.

          Two things to know:

          1. **Your paper has probably already stopped.** A publishing repo commits an issue every week, so this counter only climbs when the weekly run is not publishing. Check the **Actions** tab before worrying about the schedule itself.
          2. **Any commit resets the 60 days.** If the workflows have already been disabled, re-enable them by hand from the Actions tab — GitHub does not do it for you when activity resumes.

          Run: \${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }}"
          else
            echo "::notice::schedule-at-risk issue already open — not filing another"
          fi

      - name: Report a broken site
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create site-down --color B60205 \
            --description "The published site failed its smoke test" 2>/dev/null || true
          # One open issue at a time — a daily cron must not manufacture a daily
          # report of the same problem.
          if [ -z "$(gh issue list --label site-down --state open --limit 1 --json number --jq '.[].number')" ]; then
            gh issue create --label site-down \
              --title "Site smoke test failing" \
              --body "The published site failed its smoke test. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Nothing here diagnoses itself — check, in order: the last Cloudflare deployment matches the last commit; the Worker's custom domain (if any) is still attached; DNS still resolves. docs/OPERATIONS.md has the failure signatures."
          else
            echo "::notice::site-down issue already open — not filing another"
          fi
