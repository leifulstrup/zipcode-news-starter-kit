# Kit self-test. Keeps the README's "Node 20+" claim true instead of
# aspirational: a fresh clone must pass doctor and build on every Node version
# the kit claims to support. No secrets, no network, no cost — this runs on the
# kit itself and on every instance that pulls it.
#
# It deliberately tests the UNCONFIGURED state, because that is what a new
# publisher has in their first thirty seconds, and it is the state the kit
# promises will be green.
name: Kit self-test

on:
  push:
    branches: [main]
    paths-ignore: ['issues/**', 'addendum/**', 'data/**', 'docs/architecture.svg']
  pull_request:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one bad version must not hide the others
      matrix:
        node: ['20', '22', '24', 'latest']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Gates catch what they claim (doctor)
        run: node bin/doctor.mjs

      # package-lock.json is tracked, and `npm install` writes it. A lockfile that has drifted
      # from package.json gets rewritten in the middle of the weekly run, leaving a modified
      # file that stops the final push and discards a finished issue. Caught here on the push
      # that causes the drift, it costs nothing; caught on a Friday it costs a week's edition.
      # The kit shipped with exactly this drift and could not see it, because the template's
      # own weekly run stops at the placeholder-ZIP preflight.
      - name: The lockfile agrees with package.json
        run: node bin/check-lockfile.mjs

      # Every `run:` block is a shell script that nothing executes until your publish day.
      # `.github/` is guarded, gated and reviewed, and none of that runs a line of it — which
      # is how a broken step reached main in the reference implementation on 2026-09-12 and
      # died with `found: command not found`. Syntax only; the script's own header is honest
      # about what that leaves uncovered.
      - name: Every workflow step is at least valid shell
        run: node bin/check-workflow-shell.mjs
      - name: A fresh clone builds
        run: node build.mjs
      - name: Orientation works
        run: node bin/next-step.mjs
      - name: Fetch layer runs with zero adapters
        run: |
          node bin/fetch-data.mjs --week 2026-01-02
          rm -f data/facts/2026-01-02.json
      - name: Watchdog scripts run clean on a fresh kit
        run: |
          node bin/check-published.mjs
          node bin/probe-sources.mjs
          node bin/source-retrospective.mjs --min-age-days 21
      - name: Measurement runs on the fixture
        run: node QA-QC/measure-issue.mjs fixtures/good-issue.html > /dev/null
      - name: Deprecation warnings are visible, not hidden
        # Not a failure: newer Node versions warn before they break, and the
        # point is to see the warning here rather than in a publisher's run.
        run: node --trace-deprecation bin/doctor.mjs 2>&1 | grep -i "deprecat" && echo "::warning::deprecation warnings on node ${{ matrix.node }} — fix before they become errors" || echo "no deprecation warnings"
